name: Tag release
on:
  push:
    branches: [master]

jobs:
  tag_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      release_version: ${{ steps.outputs.outputs.release_version }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Extract and setup release information
        run: |
          releaseVersion=`cat VERSION`
          export RELEASE_VERSION=$releaseVersion
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
      - name: Sync version + package
        run: |
          npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce package --out "venom-${{ env.RELEASE_VERSION }}.vsix"
          sha256sum "venom-${{ env.RELEASE_VERSION }}.vsix" > "venom-${{ env.RELEASE_VERSION }}.vsix.sha256"
      - name: Create GitHub Release and Upload Artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          artifacts: |
            venom-*.vsix
            venom-*.vsix.sha256
